name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    uses: OpenAEC-Foundation/github/.github/workflows/deploy-site.yml@main
    with:
      deploy_host: ${{ vars.DEPLOY_HOST }}
      deploy_port: ${{ vars.DEPLOY_PORT }}
      deploy_user: ${{ vars.DEPLOY_USER }}
      deploy_path: /var/www/monty-ifc-viewer.open-aec.com
      node_version: "22"
      install_command: npm ci
      build_command: npm test && npm run build
      deploy_source: dist
    secrets:
      deploy_ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}

  verify-deployment:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Verify live HTML, asset MIME types, and missing-asset responses
        run: npm run test:deployment
