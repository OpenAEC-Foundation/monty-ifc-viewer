name: monty-ifc-viewer
base: core22
version: 0.0.0
title: Monty IFC Viewer
summary: Monty IFC Viewer for Linux
description: Monty IFC Viewer. This Snap packages the published OpenAEC release with its approved app
  logo.
grade: stable
confinement: strict
icon: src-tauri/icons/icon.png
architectures:
- amd64
apps:
  monty-ifc-viewer:
    command: usr/bin/monty-ifc-viewer
    extensions:
    - gnome
    desktop: usr/share/applications/monty-ifc-viewer.desktop
    plugs:
    - home
    - removable-media
    - network
    - browser-support
    - audio-playback
parts:
  monty-ifc-viewer:
    plugin: nil
    stage-packages:
    - libappindicator3-1
    override-build: 'set -eu

      dpkg-deb -x "${CRAFT_PROJECT_DIR}/release.deb" "${CRAFT_PART_INSTALL}"

      python3 "${CRAFT_PROJECT_DIR}/snap/prepare-desktop.py" "${CRAFT_PART_INSTALL}"

      '
