server {
    listen 80;
    listen [::]:80;
    server_name speckle.open-aec.com speckle-files.open-aec.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name speckle.open-aec.com;
    ssl_certificate /etc/letsencrypt/live/open-aec.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/open-aec.com/privkey.pem;
    client_max_body_size 100m;
    access_log /var/log/nginx/speckle.access.log;
    error_log /var/log/nginx/speckle.error.log;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_intercept_errors on;
    }
    error_page 500 502 503 504 = /service-error;
    location = /service-error {
        internal;
        default_type text/plain;
        return 503 "An error occurred. Check the log.\n";
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name speckle-files.open-aec.com;
    ssl_certificate /etc/letsencrypt/live/open-aec.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/open-aec.com/privkey.pem;
    client_max_body_size 100m;
    # Signed S3 query strings carry temporary credentials: omit them from access logs.
    access_log off;
    error_log /var/log/nginx/speckle-files.error.log;

    location / {
        proxy_pass http://127.0.0.1:19000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
