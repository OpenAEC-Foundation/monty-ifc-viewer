# Monty has separate landing and viewer entry points.
server {
    listen 80;
    listen [::]:80;
    server_name monty-ifc-viewer.open-aec.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name monty-ifc-viewer.open-aec.com;
    root /var/www/monty-ifc-viewer.open-aec.com;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/open-aec.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/open-aec.com/privkey.pem;

    location ~ ^/[^/.]+/?$ {
        try_files $uri $uri/ /landing/index.html;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~ \.html$ {
        add_header Cache-Control "no-cache";
    }
}
